<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #141414; }
      .subtitle { font: 18px Arial, sans-serif; fill: #424242; }
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 3; rx: 10; }
      .chip { fill: #111827; stroke: #374151; stroke-width: 3; rx: 8; }
      .board { fill: #fbf7e9; stroke: #7c5f20; stroke-width: 4; rx: 16; }
      .panel { fill: #eef6ff; stroke: #2563eb; stroke-width: 3; rx: 12; }
      .rail5 { stroke: #d62828; stroke-width: 5; fill: none; }
      .gnd { stroke: #111827; stroke-width: 5; fill: none; }
      .sig { stroke: #2563eb; stroke-width: 4; fill: none; }
      .ctrl { stroke: #7c3aed; stroke-width: 4; fill: none; }
      .out { stroke: #f97316; stroke-width: 4; fill: none; }
      .thin { stroke-width: 3; }
      .label { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #111827; }
      .tiny { font: 13px Arial, sans-serif; fill: #111827; }
      .pin { fill: #fff; stroke: #111827; stroke-width: 2; }
      .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 3; rx: 10; }
      .check { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; rx: 10; }
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#ffffff"/>
  <text x="55" y="55" class="title">DIY Eurorack BPM Clock - Wiring / Install Diagram</text>
  <text x="55" y="85" class="subtitle">Matches your Nano R4 + OLED/encoder board, SN74AHCT125N buffer, 16-pin power header, and off-board output jacks.</text>

  <rect x="55" y="125" width="1010" height="880" class="board"/>
  <text x="80" y="160" class="label">Main perfboard / stripboard</text>

  <path d="M105 205 H1015" class="rail5"/>
  <text x="110" y="194" class="label" fill="#d62828">+5V rail after 10 ohm input resistor</text>
  <path d="M105 955 H1015" class="gnd"/>
  <text x="110" y="990" class="label">GND rail</text>

  <rect x="115" y="730" width="230" height="180" class="box"/>
  <text x="135" y="765" class="label">16-pin Eurorack</text>
  <text x="135" y="792" class="label">power header</text>
  <text x="135" y="830" class="small">Use only +5V and GND</text>
  <text x="135" y="856" class="small">Leave +12V, -12V,</text>
  <text x="135" y="880" class="small">Gate, CV unconnected</text>
  <circle cx="365" cy="780" r="7" class="pin"/>
  <text x="382" y="786" class="small">+5V</text>
  <circle cx="365" cy="865" r="7" class="pin"/>
  <text x="382" y="871" class="small">GND</text>

  <path d="M372 780 H430" class="rail5 thin"/>
  <rect x="430" y="760" width="90" height="40" fill="#fff" stroke="#d62828" stroke-width="3" rx="6"/>
  <text x="445" y="786" class="small">10 ohm</text>
  <path d="M520 780 H565 V205" class="rail5"/>
  <path d="M372 865 H565 V955" class="gnd"/>

  <rect x="420" y="250" width="260" height="360" class="panel"/>
  <text x="455" y="285" class="label">Arduino Nano R4</text>
  <text x="455" y="318" class="small">5V  -> +5V rail</text>
  <text x="455" y="342" class="small">GND -> GND rail</text>
  <text x="455" y="380" class="small">D2  -> TRA</text>
  <text x="455" y="404" class="small">D3  -> TRB</text>
  <text x="455" y="428" class="small">D4  -> PSH</text>
  <text x="455" y="452" class="small">A4  -> SDA</text>
  <text x="455" y="476" class="small">A5  -> SCL</text>
  <text x="455" y="514" class="small">D8  -> AHCT pin 2</text>
  <text x="455" y="538" class="small">D9  -> AHCT pin 5</text>
  <text x="455" y="562" class="small">D10 -> AHCT pin 9</text>
  <text x="455" y="586" class="small">D11 -> AHCT pin 12</text>
  <text x="455" y="610" class="small">D12 -> enable node</text>

  <path d="M540 250 V205" class="rail5 thin"/>
  <path d="M565 610 V955" class="gnd thin"/>

  <rect x="720" y="240" width="295" height="285" class="box"/>
  <text x="750" y="275" class="label">OLED + encoder board</text>
  <text x="750" y="312" class="small">COM -> GND</text>
  <text x="750" y="336" class="small">SDA -> Nano A4</text>
  <text x="750" y="360" class="small">SCL -> Nano A5</text>
  <text x="750" y="384" class="small">PSH -> Nano D4</text>
  <text x="750" y="408" class="small">TRA -> Nano D2</text>
  <text x="750" y="432" class="small">TRB -> Nano D3</text>
  <text x="750" y="456" class="small">BAK -> leave open</text>
  <text x="750" y="480" class="small">GND -> GND</text>
  <text x="750" y="504" class="small">VCC -> +5V</text>

  <path d="M680 452 C700 452 700 336 720 336" class="sig"/>
  <path d="M680 476 C702 476 702 360 720 360" class="sig"/>
  <path d="M680 428 C704 428 704 384 720 384" class="ctrl"/>
  <path d="M680 380 C706 380 706 408 720 408" class="ctrl"/>
  <path d="M680 404 C708 404 708 432 720 432" class="ctrl"/>
  <path d="M900 240 V205" class="rail5 thin"/>
  <path d="M930 525 V955" class="gnd thin"/>

  <rect x="725" y="625" width="260" height="235" class="chip"/>
  <text x="760" y="660" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">SN74AHCT125N</text>
  <text x="750" y="695" fill="#fff" class="small">DIP-14 socket, notch up</text>
  <text x="750" y="728" fill="#fff" class="small">14 VCC -> +5V</text>
  <text x="750" y="752" fill="#fff" class="small">7 GND  -> GND</text>
  <text x="750" y="786" fill="#fff" class="small">1,4,10,13 -> enable node</text>
  <text x="750" y="810" fill="#fff" class="small">enable node -> 10k -> +5V</text>
  <text x="750" y="834" fill="#fff" class="small">enable node -> Nano D12</text>
  <circle cx="985" cy="685" r="7" class="pin"/>
  <text x="998" y="691" class="small">pin 14</text>
  <circle cx="985" cy="780" r="7" class="pin"/>
  <text x="998" y="786" class="small">pin 7</text>
  <path d="M985 685 H1018 V205" class="rail5 thin"/>
  <path d="M985 780 H1020 V955" class="gnd thin"/>
  <rect x="997" y="715" width="70" height="34" fill="#fff" stroke="#374151" stroke-width="2" rx="5"/>
  <text x="1008" y="738" class="tiny">100nF</text>
  <path d="M1030 715 V685" class="rail5 thin"/>
  <path d="M1030 749 V780" class="gnd thin"/>

  <path d="M680 514 C700 514 700 670 725 670" class="sig"/>
  <text x="595" y="680" class="tiny">D8 -> pin 2</text>
  <path d="M680 538 C700 538 700 705 725 705" class="sig"/>
  <text x="595" y="715" class="tiny">D9 -> pin 5</text>
  <path d="M680 562 C700 562 700 740 725 740" class="sig"/>
  <text x="585" y="750" class="tiny">D10 -> pin 9</text>
  <path d="M680 586 C700 586 700 775 725 775" class="sig"/>
  <text x="585" y="785" class="tiny">D11 -> pin 12</text>
  <path d="M680 610 C700 610 700 835 725 835" class="ctrl"/>

  <rect x="470" y="655" width="130" height="44" fill="#fff" stroke="#7c3aed" stroke-width="3" rx="6"/>
  <text x="493" y="683" class="small">10k pullup</text>
  <path d="M535 655 V205" class="rail5 thin"/>
  <path d="M600 677 H725" class="ctrl"/>

  <rect x="1110" y="160" width="420" height="720" class="box"/>
  <text x="1140" y="200" class="label">Off-board output jack wiring</text>
  <text x="1140" y="232" class="small">Use four signal wires plus one shared GND</text>

  <g>
    <path d="M985 670 H1080" class="out" marker-end="url(#arrowOrange)"/>
    <rect x="1080" y="650" width="75" height="40" fill="#fff" stroke="#f97316" stroke-width="3" rx="6"/>
    <text x="1098" y="676" class="small">1k</text>
    <path d="M1155 670 H1280" class="out"/>
    <circle cx="1340" cy="670" r="34" fill="#fff" stroke="#111827" stroke-width="3"/>
    <text x="1324" y="676" class="small">1x A</text>
    <path d="M1280 670 H1306" class="out"/>
    <path d="M1340 704 V760" class="gnd thin"/>
    <rect x="1276" y="708" width="80" height="34" fill="#fff" stroke="#111827" stroke-width="2" rx="5"/>
    <text x="1288" y="731" class="tiny">100k</text>
    <path d="M1280 670 V708" class="out thin"/>
    <path d="M1316 742 V760" class="gnd thin"/>
  </g>
  <g>
    <path d="M985 705 H1080" class="out" marker-end="url(#arrowOrange)"/>
    <rect x="1080" y="705" width="75" height="40" fill="#fff" stroke="#f97316" stroke-width="3" rx="6"/>
    <text x="1098" y="731" class="small">1k</text>
    <path d="M1155 725 H1280" class="out"/>
    <circle cx="1340" cy="725" r="34" fill="#fff" stroke="#111827" stroke-width="3"/>
    <text x="1324" y="731" class="small">1x B</text>
    <path d="M1280 725 H1306" class="out"/>
    <path d="M1340 759 V815" class="gnd thin"/>
    <rect x="1276" y="763" width="80" height="34" fill="#fff" stroke="#111827" stroke-width="2" rx="5"/>
    <text x="1288" y="786" class="tiny">100k</text>
    <path d="M1280 725 V763" class="out thin"/>
    <path d="M1316 797 V815" class="gnd thin"/>
  </g>
  <g>
    <path d="M985 740 H1080" class="out" marker-end="url(#arrowOrange)"/>
    <rect x="1080" y="760" width="75" height="40" fill="#fff" stroke="#f97316" stroke-width="3" rx="6"/>
    <text x="1098" y="786" class="small">1k</text>
    <path d="M1155 780 H1280" class="out"/>
    <circle cx="1340" cy="780" r="34" fill="#fff" stroke="#111827" stroke-width="3"/>
    <text x="1326" y="786" class="small">/2</text>
    <path d="M1280 780 H1306" class="out"/>
    <path d="M1340 814 V870" class="gnd thin"/>
    <rect x="1276" y="818" width="80" height="34" fill="#fff" stroke="#111827" stroke-width="2" rx="5"/>
    <text x="1288" y="841" class="tiny">100k</text>
    <path d="M1280 780 V818" class="out thin"/>
    <path d="M1316 852 V870" class="gnd thin"/>
  </g>
  <g>
    <path d="M985 775 H1080" class="out" marker-end="url(#arrowOrange)"/>
    <rect x="1080" y="815" width="75" height="40" fill="#fff" stroke="#f97316" stroke-width="3" rx="6"/>
    <text x="1098" y="841" class="small">1k</text>
    <path d="M1155 835 H1280" class="out"/>
    <circle cx="1340" cy="835" r="34" fill="#fff" stroke="#111827" stroke-width="3"/>
    <text x="1326" y="841" class="small">/4</text>
    <path d="M1280 835 H1306" class="out"/>
    <path d="M1340 869 V925" class="gnd thin"/>
    <rect x="1276" y="873" width="80" height="34" fill="#fff" stroke="#111827" stroke-width="2" rx="5"/>
    <text x="1288" y="896" class="tiny">100k</text>
    <path d="M1280 835 V873" class="out thin"/>
    <path d="M1316 907 V925" class="gnd thin"/>
  </g>

  <path d="M1340 925 H1020 V955" class="gnd"/>
  <text x="1170" y="960" class="small">All jack sleeves share module GND</text>

  <rect x="1120" y="280" width="380" height="145" class="check"/>
  <text x="1145" y="315" class="label">Output pin map</text>
  <text x="1145" y="348" class="small">AHCT pin 3  -> 1k -> 1x A tip</text>
  <text x="1145" y="372" class="small">AHCT pin 6  -> 1k -> 1x B tip</text>
  <text x="1145" y="396" class="small">AHCT pin 8  -> 1k -> /2 tip</text>
  <text x="1145" y="420" class="small">AHCT pin 11 -> 1k -> /4 tip</text>

  <rect x="1120" y="455" width="380" height="145" class="warn"/>
  <text x="1145" y="490" class="label">Power safety</text>
  <text x="1145" y="523" class="small">Do not power Nano USB and</text>
  <text x="1145" y="547" class="small">Eurorack at the same time.</text>
  <text x="1145" y="575" class="small">Before ICs: verify +5V to GND.</text>

  <text x="70" y="1045" class="tiny">Recommended install order: headers and sockets, power wiring, power caps, Nano/display wiring, AHCT buffer and decoupling, output resistors and jack harness, continuity tests, power test without ICs, install ICs, USB firmware test, Eurorack test.</text>
</svg>
